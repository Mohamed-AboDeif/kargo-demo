<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kargo Demo - ${STAGE_NAME}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
    }
    .container {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 500px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      color: #f8fafc;
    }
    .badge {
      display: inline-block;
      padding: 0.5rem 1.5rem;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin: 0.5rem;
    }
    .stage {
      background: #1e40af;
      color: #bfdbfe;
      font-size: 1.25rem;
      text-transform: uppercase;
    }
    .version {
      background: #065f46;
      color: #6ee7b7;
    }
    .meta {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #64748b;
    }
    .meta span {
      font-family: "SF Mono", "Fira Code", monospace;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kargo Demo V12.0.0</h1>
    <div>
      <span class="badge stage">${STAGE_NAME}</span>
      <span class="badge version">v${APP_VERSION}</span>
    </div>
    <p class="meta">Pod: <span>${HOSTNAME}</span></p>
  </div>
</body>
</html>
