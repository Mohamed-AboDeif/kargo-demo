replicaCount: 1
image:
  repository: abodeifregistfy/kargodemo
  tag: ""  # default to the chart appVersion if not set
  pullPolicy: IfNotPresent
stage: "default"
service:
  type: ClusterIP
  port: 80
resources: {}
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Argo Rollouts canary delivery
rollout:
  enabled: false
  canary:
    steps: []
    analysis: {}
