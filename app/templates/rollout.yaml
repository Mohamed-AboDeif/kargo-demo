{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "kargo-demo.fullname" . }}
  labels:
    {{- include "kargo-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kargo-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kargo-demo.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: nginx
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag  | default .Chart.AppVersion  }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.containerPort }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "kargo-demo.fullname" . }}
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        # Writable mounts required when readOnlyRootFilesystem is enabled.
        # The page is rendered into /tmp/html at startup (see start.sh).
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
      volumes:
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
  strategy:
    canary:
      canaryService: {{ include "kargo-demo.fullname" . }}-canary
      stableService: {{ include "kargo-demo.fullname" . }}
      steps:
        {{- toYaml .Values.rollout.canary.steps | nindent 8 }}
      {{- if .Values.rollout.canary.analysis }}
      analysis:
        {{- toYaml .Values.rollout.canary.analysis | nindent 8 }}
      {{- end }}
{{- end }}
