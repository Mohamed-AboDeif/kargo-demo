replicaCount: 3
stage: "prod"
image:
  tag: "0.1.0"
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 200m
    memory: 128Mi

rollout:
  enabled: true
  canary:
    steps:
    - setWeight: 10
    - pause: {}
    - setWeight: 50
    - analysis:
        templates:
        - templateName: http-health-check
        args:
        - name: stage
          value: "prod"
    - setWeight: 100
    analysis: {}
