apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: kargo-demo
  namespace: kargo-demo
spec:
  subscriptions:
  # New image tags create Freight (app code changes).
  - name: image
    image:
      repoURL: docker.io/abodeifregistfy/kargodemo
      constraint: ">=0.1.0"
      discoveryLimit: 5
  # New commits to main under charts/app/ create Freight (Helm chart changes),
  # so chart updates flow through the same test -> uat -> prod pipeline.
  - name: chart
    git:
      repoURL: https://github.com/Mohamed-AboDeif/kargo-demo
      branch: main
      includePaths:
      - charts/app
