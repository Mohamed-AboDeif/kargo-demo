apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: demo-promo-process
  namespace: kargo-demo
spec:
  vars:
  - name: gitopsRepo
    value: ${GITOPS_REPO_URL}
  - name: imageRepo
    value: docker.io/abodeifregistfy/kargodemo
  steps:
  - uses: git-clone
    config:
      repoURL: ${{ vars.gitopsRepo }}
      checkout:
      - branch: main
        path: ./src
      - branch: stage/${{ ctx.stage }}
        create: true
        path: ./out
  - uses: git-clear
    config:
      path: ./out
  - uses: yaml-update
    as: update
    config:
      path: ./src/app/values-${{ ctx.stage }}.yaml
      updates:
      - key: image.tag
        value: ${{ imageFrom(vars.imageRepo).Tag }}
  - uses: helm-template
    config:
      path: ./src/app
      outPath: ./out
      releaseName: kargo-demo
      valuesFiles:
      - ./src/app/values-${{ ctx.stage }}.yaml
  - uses: git-commit
    as: commit
    config:
      path: ./out
      message: "Promote ${{ ctx.stage }} to image tag ${{ imageFrom(vars.imageRepo).Tag }}"
  - uses: git-push
    config:
      path: ./out
  - uses: argocd-update
    config:
      apps:
      - name: kargo-demo-${{ ctx.stage }}
        sources:
        - repoURL: ${{ vars.gitopsRepo }}
          desiredRevision: ${{ task.outputs.commit.commit }}
