---
# Source: kargo-demo/templates/analysis-template.yaml
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: http-health-check
  labels:
    app.kubernetes.io/name: kargo-demo
    app.kubernetes.io/instance: kargo-demo
    app.kubernetes.io/version: "0.6.0"
    app.kubernetes.io/managed-by: Helm
spec:
  metrics:
  - name: http-check
    count: 1
    failureLimit: 0
    provider:
      job:
        spec:
          backoffLimit: 2
          template:
            spec:
              containers:
              - name: check
                image: curlimages/curl:8.10.1
                command:
                - curl
                - -sf
                - --max-time
                - "10"
                - http://kargo-demo.kargo-demo-uat.svc.cluster.local
              restartPolicy: Never
