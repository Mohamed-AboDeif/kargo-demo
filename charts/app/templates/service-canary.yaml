{{- if .Values.rollout.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kargo-demo.fullname" . }}-canary
  labels:
    {{- include "kargo-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: canary
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "kargo-demo.selectorLabels" . | nindent 4 }}

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "kargo-demo.fullname" . }}-canary
  labels:
    {{- include "kargo-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: canary
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint | default "web" }}
  routes:
    - match: Host(`canary-{{ .Values.ingress.hosts }}`)
      kind: Rule
      services:
        - name: {{ include "kargo-demo.fullname" . }}-canary
          port:  {{ .Values.service.port }}
{{- end }}
