replicaCount: 1
image:
  repository: abodeifregistfy/kargodemo
  tag: ""  # default to the chart appVersion if not set
  pullPolicy: IfNotPresent
stage: "default"
service:
  type: ClusterIP
  port: 80
# Port the nginx-unprivileged container listens on.
containerPort: 8080
resources: {}

# Pod-level security context: run as the non-root nginx user (UID 101).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# Container-level security context: no privilege escalation, read-only
# root filesystem, drop all Linux capabilities.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Argo Rollouts canary delivery
rollout:
  enabled: false
  canary:
    steps: []
    analysis: {}

ingress: {}