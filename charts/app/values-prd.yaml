replicaCount: 3
stage: "prd"
image:
  tag: "0.1.0"
resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 200m
    memory: 128Mi

rollout:
  enabled: true
  canary:
    steps:
    - setWeight: 10
    - pause: {}
    - setWeight: 50
    - analysis:
        templates:
        - templateName: http-health-check
    - setWeight: 100
    analysis: {}

ingress:
  hosts: prd.yodawy.registfylabs.online