name: Build and Push

on:
  push:
    tags: ["v*"]

env:
  IMAGE: abodeifregistfy/kargodemo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Build and load locally so the image can be scanned before it is pushed.
    - uses: docker/build-push-action@v6
      with:
        context: ./app
        load: true
        push: false
        tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}

    # Gate the release: a CRITICAL/HIGH vulnerability fails the job and blocks the push.
    # Pinned to a commit SHA (v0.36.0) following the 2026 trivy-action tag
    # compromise; prefer SHA pinning over mutable version tags.
    - name: Trivy image scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
        scanners: vuln
        severity: CRITICAL,HIGH
        exit-code: "1"
        ignore-unfixed: true

    - name: Push image
      uses: docker/build-push-action@v6
      with:
        context: ./app
        push: true
        tags: |
          ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          ${{ env.IMAGE }}:latest
