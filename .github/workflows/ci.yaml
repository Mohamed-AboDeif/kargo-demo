name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install yamllint
      run: pip install yamllint
    - name: Lint YAML files
      run: |
        yamllint -d '{
          extends: default,
          rules: {
            line-length: {max: 150},
            truthy: disable,
            document-start: disable,
            comments-indentation: disable,
            indentation: {indent-sequences: false}
          }
        }' argocd/ kargo/ app/Chart.yaml app/values.yaml app/values-test.yaml app/values-uat.yaml app/values-prod.yaml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run ShellCheck
      run: shellcheck setup.sh cleanup.sh start.sh

  helm-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Helm
      uses: azure/setup-helm@v4
    - name: Lint chart
      run: helm lint app/
    - name: Validate template rendering per stage
      run: |
        for stage in test uat prod; do
          echo "Validating stage: ${stage}"
          helm template kargo-demo app/ -f "app/values-${stage}.yaml"
        done

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test Docker build
      run: docker build -t kargodemo:test .

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v4

    # Scan repo for IaC misconfigurations, Dockerfile issues, and secrets.
    # Pinned to a commit SHA (v0.36.0) following the 2026 trivy-action tag
    # compromise; prefer SHA pinning over mutable version tags.
    - name: Trivy config/filesystem scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        scanners: misconfig,secret,vuln
        severity: CRITICAL,HIGH
        exit-code: "1"
        ignore-unfixed: true

    - name: Build image for scanning
      run: docker build -t kargodemo:scan .

    # Scan the built container image for OS/library vulnerabilities.
    - name: Trivy image scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: kargodemo:scan
        scanners: vuln
        severity: CRITICAL,HIGH
        exit-code: "1"
        ignore-unfixed: true
