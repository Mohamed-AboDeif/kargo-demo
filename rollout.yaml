---
# Source: kargo-demo/templates/rollout.yaml
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kargo-demo
  labels:
    app.kubernetes.io/name: kargo-demo
    app.kubernetes.io/instance: kargo-demo
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kargo-demo
      app.kubernetes.io/instance: kargo-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kargo-demo
        app.kubernetes.io/instance: kargo-demo
    spec:
      containers:
      - name: nginx
        image: "abodeifregistfy/kargodemo:0.5.0"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        envFrom:
        - configMapRef:
            name: kargo-demo
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 200m
            memory: 128Mi
  strategy:
    canary:
      canaryService: kargo-demo-canary
      stableService: kargo-demo
      steps:
        - setWeight: 10
        - pause: {}
        - setWeight: 50
        - analysis:
            templates:
            - templateName: http-health-check
        - setWeight: 100
